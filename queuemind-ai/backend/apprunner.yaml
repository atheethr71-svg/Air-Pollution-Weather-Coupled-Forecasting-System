version: 1.0
runtime: python311
build:
  commands:
    pre-build:
      - echo "QueueMind AI - Starting App Runner Build Process..."
    build:
      - pip install --upgrade pip
      - pip install -r requirements.txt
    post-build:
      - python -c "from app.main import app; print('App loaded successfully for App Runner!')"
run:
  runtime-version: 3.11
  command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    - name: DEMO_MODE
      value: "true"
    - name: PROJECT_NAME
      value: "QueueMind AI"
    - name: AWS_REGION
      value: "us-east-1"
    - name: SECRET_KEY
      value: "queuemind-apprunner-production-jwt-token-2026"
