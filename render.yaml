services:
  # Backend API & Computer Vision Engine
  - type: web
    name: queuemind-backend
    runtime: python
    rootDir: queuemind-ai/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: AWS_REGION
        value: us-east-1

  # Next.js Frontend
  - type: web
    name: queuemind-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: queuemind-backend
          type: web
          property: host
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          name: queuemind-backend
          type: web
          property: host
